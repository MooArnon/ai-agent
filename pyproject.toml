[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_agent"
version = "0.1.0"
authors = [
    { name="Arnon Phongsiang", email="arnon.phongsiang@gmail.com" },
]
description = "A package for developing and experimenting with AI agents. Explore, build, and deploy autonomous systems powered by large language models (LLMs)."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "openai~=1.101.0",
    "scipy~=1.13.1",
    "qdrant-client~=1.15.1",
]